name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Deploy API
        run: curl -s -f "${{ secrets.COOLIFY_WEBHOOK_API }}"

      - name: Deploy Web
        run: curl -s -f "${{ secrets.COOLIFY_WEBHOOK_WEB }}"
