name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: b-cal-api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: b-cal-web
            context: .
            dockerfile: apps/web/Dockerfile
            build-args: NEXT_PUBLIC_BACKEND_URL=http://placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.build-args && format('--build-arg {0}', matrix.build-args) || '' }} \
            -t ${{ matrix.image }}:${{ github.sha }} \
            ${{ matrix.context }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: ${{ matrix.image }}-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ matrix.image }}-results.sarif
          category: trivy-${{ matrix.image }}

  release:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Deploy to Coolify
        run: |
          curl -s -f "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_API_UUID }},${{ secrets.COOLIFY_WEB_UUID }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
