services:
  postgres:
    image: postgres:16-alpine
    container_name: b-cal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: b_cal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d b_cal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: b-cal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass dev-redis-password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-redis-password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: b-cal-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/main"]
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: http://localhost:8080
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: b_cal
      DB_PORT: 5432
      DB_HOST: postgres
      SECRET_KEY: my-super-secret-key-for-dev-only!
      REFRESH_SECRET_KEY: my-super-refresh-secret-dev-only!
      MAIL_SECRET_KEY: my-super-secret-mail-key-dev-only!
      CSRF_SECRET: my-super-secret-csrf-key-dev-only!
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USER: user
      MAIL_PASS: pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: dev-redis-password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
    container_name: b-cal-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis-data:
